<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Autoquiz{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
          crossorigin="anonymous">
  </head>
  <body class="bg-body-tertiary">
    {% with current=request.resolver_match.url_name %}
    <nav class="navbar navbar-expand-md bg-body border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'concierge:index' %}">Autoquiz</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#primary-nav" aria-controls="primary-nav"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="primary-nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link{% if current == 'index' %} active{% endif %}"
                 {% if current == 'index' %}aria-current="page"{% endif %}
                 href="{% url 'concierge:index' %}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if current == 'about' %} active{% endif %}"
                 {% if current == 'about' %}aria-current="page"{% endif %}
                 href="{% url 'concierge:about' %}">About</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    {% endwith %}

    <main class="container py-5" style="max-width: 860px;">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
            crossorigin="anonymous"></script>
  </body>
</html>
